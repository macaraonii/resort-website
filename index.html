<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Caribbean Waves Resort - Prototype</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Nunito+Sans:wght@300;400;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			body {
				font-family: 'Nunito Sans', sans-serif;
				margin: 0;
				padding: 2.5rem;
				background: #f6fbff;
				color: #0b2d4b;
			}
			main {
				max-width: 720px;
				margin: 0 auto;
				background: #ffffff;
				padding: 2rem;
				border-radius: 16px;
				box-shadow: 0 12px 30px rgba(10, 48, 80, 0.12);
			}
			h1 {
				margin-top: 0;
				font-family: 'Bree Serif', serif;
			}
			p {
				line-height: 1.6;
			}
			code {
				background: #eef6ff;
				padding: 0.2rem 0.4rem;
				border-radius: 6px;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Caribbean Waves Reservation Prototype</h1>
			<p>
				This repository now contains a full-stack prototype with a React + Tailwind
				customer experience and a Node.js + Express admin backend. See
				<code>README.md</code> for setup instructions.
			</p>
			<p>
				Start the frontend from <code>client/</code> and the backend from
				<code>server/</code>.
			</p>
		</main>
	</body>
</html>
